# Crea el borrador vacío de una versión. Los ficheros y las notas se añaden después.
name: Crear borrador
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versión (por ejemplo v1.0.19)'
        required: true
permissions:
  contents: write
jobs:
  crear:
    runs-on: ubuntu-latest
    steps:
      - name: Crear el borrador
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" --draft --title "$TAG" --notes "Borrador"
